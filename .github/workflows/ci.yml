name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: macOS (Python ${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
